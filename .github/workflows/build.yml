name: Build Android APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'

    - name: Install buildozer and cython
      run: |
        pip install --user --upgrade buildozer cython

    - name: Install system dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y build-essential ccache git libffi-dev libssl-dev libheaders-v4l2-dev libgdbm-dev libnss3-dev libsqlite3-dev libreadline-dev libbz2-dev python3-dev-is-python3 unzip zip openjdk-17-jdk

    - name: Build with Buildozer
      run: |
        yes | ~/.local/bin/buildozer android debug

    - name: Upload APK
      uses: actions/upload-artifact@v4
      with:
        name: package
        path: bin/*.apk
